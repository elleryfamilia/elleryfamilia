name: update readme

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

# Serialize cron, push, and manual runs so they never race on the push.
concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  stars:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: regenerate recently starred section
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-stars.sh
      - name: render stat cards
        env:
          # Optional CARDS_TOKEN (a PAT with read:user) includes private
          # contributions in the counts; the default token sees public data only.
          GH_TOKEN: ${{ secrets.CARDS_TOKEN || github.token }}
        run: ./scripts/render-cards.py
      - name: commit if changed
        run: |
          git add README.md assets/cards
          if ! git diff --quiet --cached; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh readme cards and stars"
            git pull --rebase origin main
            git push
          fi
